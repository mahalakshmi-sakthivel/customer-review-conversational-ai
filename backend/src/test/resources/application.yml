spring:
  application:
    name: backend-test
  datasource:
    url: jdbc:h2:mem:reviewai_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  jackson:
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSXXX
    datatype:
      datetime:
        write-dates-as-timestamps: false

app:
  jwt:
    secret: "dGhpcy1pcy1hLXNlY3JldC1qd3Qta2V5LWZvci10ZXN0aW5nLTM4NGJpdHMtbG9uZyE="
  security:
    bcrypt-strength: 4
    encryption-key: "dGhpcy1pcy1hbi1lbmNyeXB0aW9uLWtleS1mb3ItdGVzdA=="

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
