spring.application.name=customer-review-backend-test

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Flyway disabled for fast in-memory schema generation during test slice
spring.flyway.enabled=false

app.security.encryption-key=0123456789abcdef0123456789abcdef
app.security.hmac-key=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

security.jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
