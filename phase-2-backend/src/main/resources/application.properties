

spring.application.name=customer-review-backend

# Application runtime account
spring.datasource.url=jdbc:postgresql://localhost:5432/customer_review_ai
spring.datasource.username=customer_review_app
spring.datasource.password=${APP_DB_PASSWORD}

# Validate schema; do not let Hibernate create or alter tables
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway migration account
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=postgres
spring.flyway.password=${DB_PASSWORD}
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=900000